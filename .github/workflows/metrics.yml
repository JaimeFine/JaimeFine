name: Metrics
on:
  schedule: 
    - cron: "0 0 */3 * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN4 }}
          committer_token: ${{ secrets.METRICS_TOKEN4 }}
          filename: metrics.plugin.isocalendar.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN4 }}
          committer_token: ${{ secrets.METRICS_TOKEN4 }}
          filename: metrics.plugin.languages.svg
          base: ""
          repositories_forks: no
          repositories_skipped: |
            collab
            thesis
            event-retrieve-action-deprecated
            event-retrieve-action
            adaptive-density-field
            swarm-policy-interference-network
            dsa-cpp
          plugin_languages_indepth_custom: |
            */*@main
          plugin_languages: yes
          plugin_languages_skipped: |
            collab
            thesis
            event-retrieve-action-deprecated
            event-retrieve-action
            adaptive-density-field
            swarm-policy-interference-network
            dsa-cpp
          plugin_languages_indepth: no
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          plugin_languages_ignored: makefile, tex, jupyter notebook
          
